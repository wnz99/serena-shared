[project]
name = "serena-shared"
version = "0.1.0"
description = "Share one Serena MCP server per repository across concurrent Claude Code, Codex and other MCP clients."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=2.2,<3", "anyio>=4", "httpx2>=2.5"]
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]

[project.scripts]
serena-shared = "serena_shared.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serena_shared"]
